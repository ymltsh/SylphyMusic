publish_to: none
version: 0.2.1+3
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.5
  audio_metadata_reader: ^1.8.1
  synchronized: ^3.5.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
