name: OpenList Lite Android preview
on:
  push:
    branches: ['feature/android-openlist-lite']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    if: github.ref == 'refs/heads/feature/android-openlist-lite'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Go Android binding tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build pinned OpenList + embedded Web UI AAR
        run: bash tools/openlist_lite/build_openlist_aar.sh
      - name: Flutter dependencies
        run: flutter pub get
      - name: Format edited Flutter sources and verify parsing
        run: dart format lib/services/openlist_lite.dart lib/ui/openlist_lite_settings.dart
      - name: Build arm64 APK (internal test signing only)
        env:
          SYLPHY_INTERNAL_DEBUG_SIGNING: '1'
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sylphy-openlist-lite-android-arm64-preview
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
